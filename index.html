<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gửi cậu – 20/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#ffe4ee">
<style>
  /* ===== phong cách: pastel hồng – sổ tay 20/10 ===== */
  :root{
    --ink:#6b2250;
    --pink:#e0457f;
    --pink-soft:#ff9cc8;
    --script:'Pacifico','Dancing Script','Brush Script MT',cursive;
    --sans:'Quicksand','Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --text-glow:0 2px 0 rgba(255,255,255,.92),0 0 24px rgba(255,255,255,.95);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  @supports (height:100dvh){html,body{height:100dvh}}
  body{
    background:linear-gradient(165deg,#fff6ef 0%,#ffe4ee 48%,#f1e3ff 100%);
    color:var(--ink);overflow:hidden;position:relative;
    font-family:var(--sans);font-weight:600;
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;cursor:pointer;
  }
  /* viền nét đứt kiểu sổ tay */
  body::after{content:"";position:absolute;inset:10px;border:2px dashed rgba(224,69,127,.3);border-radius:28px;pointer-events:none;z-index:5}

  /* những mảng màu mềm trôi chậm ở nền */
  #blobs{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  #blobs i{position:absolute;border-radius:50%;opacity:.8;animation:drift 18s ease-in-out infinite alternate;will-change:transform}
  #blobs i:nth-child(1){width:70vmax;height:70vmax;left:-24vmax;top:-22vmax;background:radial-gradient(circle,#ffbcd8 0,rgba(255,188,216,0) 68%)}
  #blobs i:nth-child(2){width:62vmax;height:62vmax;right:-24vmax;top:20%;background:radial-gradient(circle,#e1c8ff 0,rgba(225,200,255,0) 68%);animation-duration:23s;animation-delay:-7s}
  #blobs i:nth-child(3){width:58vmax;height:58vmax;left:6%;bottom:-30vmax;background:radial-gradient(circle,#ffe0b0 0,rgba(255,224,176,0) 68%);animation-duration:27s;animation-delay:-12s}
  @keyframes drift{to{transform:translate(7vmax,5vmax) scale(1.12)}}

  /* ===== nền: màu theo cảnh ===== */
  #tint{position:absolute;inset:0;z-index:1;pointer-events:none}
  #tint i{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease-in-out}
  #tint .t-pink  {background:radial-gradient(ellipse at 50% 55%,rgba(255,120,175,.42),rgba(255,160,200,.2) 45%,transparent 75%)}
  #tint .t-night {background:radial-gradient(ellipse at 50% 100%,rgba(176,150,255,.5),rgba(210,190,255,.22) 50%,transparent 80%)}
  #tint .t-health{background:radial-gradient(ellipse at 50% 55%,rgba(120,230,195,.5),rgba(190,245,225,.22) 45%,transparent 75%)}
  #tint .t-beauty{background:radial-gradient(ellipse at 50% 50%,rgba(255,150,220,.46),rgba(205,160,255,.24) 50%,transparent 80%)}
  #tint .t-warm  {background:radial-gradient(ellipse at 50% 55%,rgba(255,200,120,.55),rgba(255,170,130,.22) 50%,transparent 80%)}
  #tint .t-green {background:radial-gradient(ellipse at 50% 85%,rgba(130,225,130,.55),rgba(190,240,170,.22) 55%,transparent 85%)}
  #tint .t-blue  {background:radial-gradient(ellipse at 50% 40%,rgba(140,195,255,.55),rgba(190,215,255,.22) 50%,transparent 80%)}
  #tint .t-final {background:radial-gradient(ellipse at 50% 50%,rgba(255,125,185,.5),rgba(255,205,125,.22) 50%,transparent 85%)}
  body[data-s="3"]  #tint .t-pink,
  body[data-s="4"]  #tint .t-night,
  body[data-s="5"]  #tint .t-night,
  body[data-s="6"]  #tint .t-health,
  body[data-s="7"]  #tint .t-beauty,
  body[data-s="8"]  #tint .t-warm,
  body[data-s="9"]  #tint .t-green,
  body[data-s="10"] #tint .t-green,
  body[data-s="11"] #tint .t-green,
  body[data-s="12"] #tint .t-blue,
  body[data-s="13"] #tint .t-blue,
  body[data-s="14"] #tint .t-final{opacity:1}

  #rays{position:absolute;left:50%;top:42%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.8s ease;
    background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.65) 0 6deg,transparent 6deg 18deg);
    -webkit-mask-image:radial-gradient(circle,#000 0,transparent 45%);mask-image:radial-gradient(circle,#000 0,transparent 45%);
    animation:spin 70s linear infinite}
  body[data-s="12"] #rays,body[data-s="13"] #rays{opacity:1}
  @keyframes spin{to{transform:rotate(360deg)}}

  #fx{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}

  /* ===== trang trí theo cảnh ===== */
  .deco{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;visibility:hidden;transition:opacity 1.1s ease,visibility 1.1s}
  body[data-s="5"]  #d-crystal,
  body[data-s="6"]  #d-health,
  body[data-s="7"]  #d-beauty,
  body[data-s="8"]  #d-smile,
  body[data-s="9"]  #d-clover,
  body[data-s="10"] #d-clover,
  body[data-s="14"] #d-final{opacity:1;visibility:visible}

  /* pha lê (nên là tớ muốn) */
  #d-crystal svg{position:absolute;left:50%;top:60%;width:min(52vw,250px);transform:translate(-50%,-50%);overflow:visible;filter:drop-shadow(0 6px 22px rgba(190,120,240,.55))}
  .orb1{transform-origin:110px 110px;animation:spin 14s linear infinite}
  .orb2{transform-origin:110px 110px;animation:spin 22s linear infinite reverse}
  .gem{animation:gemPulse 3.2s ease-in-out infinite;transform-origin:110px 110px}
  @keyframes gemPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

  /* sức khỏe */
  #d-health .heart{position:absolute;left:50%;top:60%;width:min(38vw,170px);transform:translate(-50%,-50%);animation:beat 1.1s ease-in-out infinite;filter:drop-shadow(0 6px 18px rgba(40,190,150,.45))}
  #d-health .heart path{fill:rgba(60,205,165,.22);stroke:#1fae89;stroke-width:3}
  @keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}18%{transform:translate(-50%,-50%) scale(1.12)}34%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}
  #d-health .ecg{position:absolute;left:0;width:100%;top:calc(60% - 52px);height:104px;opacity:.95;filter:drop-shadow(0 2px 6px rgba(40,190,150,.5))}
  #d-health .ecg path{fill:none;stroke:#17a07c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:560;stroke-dashoffset:560;animation:ecg 2.6s linear infinite}
  @keyframes ecg{0%{stroke-dashoffset:560}60%{stroke-dashoffset:0}100%{stroke-dashoffset:-560}}

  /* xinh đẹp */
  #d-beauty .garland{position:absolute;left:0;right:0;top:0;height:140px;background:
    radial-gradient(circle at 10% 0,rgba(255,150,205,.55),transparent 42%),
    radial-gradient(circle at 90% 0,rgba(200,160,255,.55),transparent 42%);
    -webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
  #d-beauty .ring{position:absolute;left:50%;top:46%;width:min(80vw,440px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    border:1.5px dashed rgba(214,90,160,.55);box-shadow:0 0 40px rgba(255,150,220,.3) inset,0 0 40px rgba(255,150,220,.3);animation:spin 40s linear infinite}
  #d-beauty .ring.b{width:min(62vw,330px);animation-direction:reverse;animation-duration:28s;border-style:dotted}

  /* nụ cười */
  #d-smile .halo{position:absolute;left:50%;top:46%;width:min(80vw,460px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(255,205,110,.55),rgba(255,160,130,.2) 55%,transparent 72%);animation:haloPulse 4s ease-in-out infinite}
  @keyframes haloPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}}
  #d-smile .vinyl{position:absolute;right:6%;bottom:22%;width:min(26vw,120px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,#ff9ec4 0 14%,#3a1830 15% 17%,#52284a 18% 44%,#2b1226 45% 47%,#52284a 48% 74%,#2b1226 75%);
    box-shadow:0 8px 24px rgba(224,69,127,.4);animation:spin 5s linear infinite}

  /* cỏ 4 lá */
  #d-clover svg{position:absolute;left:0;bottom:31%;width:100%;height:52%;overflow:visible}
  .cl{transform-origin:var(--ox) var(--oy);animation:sway var(--sd,4s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
  @keyframes sway{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}
  .cl .leaf{fill:url(#gLeaf);stroke:rgba(30,135,70,.55);stroke-width:1.4;filter:drop-shadow(0 3px 5px rgba(40,150,80,.4))}
  .cl .stem{fill:none;stroke:#3fb862;stroke-width:3.2;stroke-linecap:round}
  .cl{transition:opacity 1.2s}
  .cl .pick{transform-origin:var(--ox) var(--oy);transition:transform 1.6s cubic-bezier(.2,.8,.2,1)}
  .cl .hit{fill:transparent;pointer-events:none}
  body[data-s="9"] .cl .hit{pointer-events:all;cursor:pointer}
  body[data-s="9"] .cl .leaf{transition:filter .3s}
  body[data-s="9"] .cl:hover .leaf{filter:drop-shadow(0 0 12px rgba(255,214,90,.95))}
  body[data-s="10"] .cl.picked .pick{transform:translate(var(--dx),0) scale(1.3)}
  body[data-s="10"] .cl.picked .leaf{filter:drop-shadow(0 0 14px rgba(255,214,90,.95))}
  body[data-s="10"] .cl:not(.picked){opacity:0}

  /* zoom vào nhụy cỏ → sang cảnh kế */
  #d-clover{will-change:transform,opacity}
  #flash{position:absolute;z-index:8;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;pointer-events:none;opacity:0;transform:scale(0);will-change:transform,opacity;
    background:radial-gradient(circle,rgba(255,255,235,.95) 0,rgba(200,255,170,.6) 40%,rgba(150,255,140,0) 70%)}
  body.dive #d-clover{transform:scale(45);opacity:0;visibility:visible!important;
    transition:transform 1.9s cubic-bezier(.55,0,.9,.5),opacity 1.9s cubic-bezier(.35,0,.7,1)}
  body.dive #flash{animation:flashGlow 1.9s ease-in-out forwards}
  @keyframes flashGlow{0%{opacity:0;transform:scale(.4)}45%{opacity:.6}100%{opacity:0;transform:scale(36)}}
  body.dive .cl{animation-play-state:paused}

  /* final */
  #d-final .heart{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:min(30vw,170px);animation:beat 1.2s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(255,105,180,.7))}

  /* ===== đôi mắt Tiny (mắt tròn long lanh) ===== */
  #face{position:absolute;left:50%;top:46%;z-index:6;display:flex;gap:min(15vw,120px);transform:translate(-50%,-50%);transition:opacity 1.1s ease,top 1.2s cubic-bezier(.2,.8,.2,1);opacity:0;pointer-events:none}
  body.eyes #face{opacity:1}
  body[data-s="9"] #face,body[data-s="10"] #face{opacity:0}
  body[data-s="5"] #face,body[data-s="6"] #face{top:35%}
  .eye{position:relative;width:min(19vw,104px);height:min(25vw,140px)}
  .eye .slide{position:absolute;inset:0;transform:translate(var(--ex,0px),var(--ey,0px))}
  .eye .glow{position:absolute;inset:0;border-radius:42% 42% 46% 46% / 46% 46% 54% 54%;
    background:var(--eye,#5b2a4e);
    box-shadow:0 10px 20px rgba(120,40,90,.28),inset 0 -10px 16px rgba(0,0,0,.2);
    transform:scaleY(var(--open,.05));transform-origin:50% 55%;transition:transform .16s ease-out,background .6s}
  .eye .glow::before{content:"";position:absolute;left:20%;top:13%;width:32%;height:22%;border-radius:50%;background:rgba(255,255,255,.95)}
  .eye .glow::after{content:"";position:absolute;right:19%;bottom:15%;width:14%;height:10%;border-radius:50%;background:rgba(255,255,255,.7)}
  body.awake .eye .glow{--open:1}
  body.blink .eye .glow{--open:.07}
  /* cảnh "có thể?" – nháy một mắt */
  body[data-s="12"].wink .eye.r .glow{--open:.1;border-radius:50% 50% 50% 50%/70% 70% 30% 30%}
  .blush{position:absolute;left:50%;top:calc(100% + 18px);transform:translateX(-50%);white-space:nowrap;color:#ff4f93;letter-spacing:6px;font-weight:700;font-size:min(5vw,26px);text-shadow:0 0 10px rgba(255,255,255,.95);opacity:0;transition:opacity .6s}
  body.blushing .blush{opacity:.95}
  /* màu mắt đổi theo cảnh */
  body[data-s="3"],body[data-s="7"],body[data-s="14"]{--eye:#7a2456}
  body[data-s="6"]{--eye:#1d6a5c}
  body[data-s="8"]{--eye:#7a4413}
  body[data-s="12"],body[data-s="13"]{--eye:#2b4b94}

  /* ===== chữ ===== */
  .text-layer{
    position:absolute;left:0;width:100%;padding:0 7vw;z-index:10;text-align:center;color:var(--ink);
    letter-spacing:1.5px;font-size:clamp(1.5rem,5.2vw,3rem);line-height:1.45;font-weight:700;
    text-shadow:var(--text-glow);
    opacity:0;transition:opacity .7s ease-in-out;pointer-events:none;text-wrap:balance;
  }
  .text-layer.show{opacity:1}
  .text-layer.center{top:50%;transform:translateY(-50%);font-size:clamp(2rem,7vw,4rem)}
  .text-layer.bottom{bottom:15%}
  .text-layer.top{top:11%}
  #t0{font-family:var(--script);font-weight:400;letter-spacing:1px;color:var(--pink)}
  .text-layer.pink{color:var(--pink);text-shadow:var(--text-glow),0 0 18px rgba(255,120,175,.55)}
  .text-layer.mint{color:#188f72;text-shadow:var(--text-glow),0 0 18px rgba(60,205,165,.5)}
  .text-layer.rose{color:#b03f98;text-shadow:var(--text-glow),0 0 18px rgba(200,120,255,.5)}
  .text-layer.gold{color:#bd6f10;text-shadow:var(--text-glow),0 0 18px rgba(255,190,90,.6)}
  .text-layer.green{color:#2a8c45;text-shadow:var(--text-glow),0 0 18px rgba(110,220,130,.55)}
  .text-layer.blue{color:#3a70c2;text-shadow:var(--text-glow),0 0 18px rgba(130,185,255,.6)}
  #t14,.big-final{font-size:clamp(2.2rem,9vw,4.4rem)}
  #t14{font-family:var(--script);font-weight:400;letter-spacing:1px}
  .clover-word,.luck-word,.q-word{font-family:var(--script);font-weight:400;letter-spacing:.5px}
  .clover-word{color:#2c9a4c;text-shadow:var(--text-glow),0 0 16px rgba(80,210,110,.6)}
  .luck-word{color:#e0457f;text-shadow:var(--text-glow),0 0 16px rgba(255,120,175,.55)}
  .q-word{color:#7a4ad6;text-shadow:var(--text-glow),0 0 16px rgba(160,130,255,.55)}
  .text-layer.sway.show{animation:lacLu 3s ease-in-out infinite}
  @keyframes lacLu{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  .small-line{display:block;margin-top:.55em;font-family:var(--sans);font-size:.38em;font-weight:700;letter-spacing:1.5px;color:#b03f98;opacity:.95}

  /* ===== tên bài hát (góc nhỏ bên trái) ===== */
  #nowplaying{position:absolute;z-index:12;left:max(20px,env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));max-width:min(72vw,330px);display:flex;align-items:center;gap:9px;
    font-size:clamp(.7rem,2.5vw,.82rem);font-weight:700;letter-spacing:.02em;color:rgba(107,34,80,.8);text-shadow:0 1px 0 rgba(255,255,255,.85);
    opacity:0;transition:opacity .9s ease;pointer-events:none}
  body.started #nowplaying{opacity:1}
  #nowplaying .eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px;flex:none}
  #nowplaying .eq i{width:3px;height:100%;border-radius:2px;background:var(--pink);transform-origin:bottom;transform:scaleY(.3);animation:eq 1s ease-in-out infinite;animation-play-state:paused}
  #nowplaying .eq i:nth-child(2){animation-delay:-.35s}
  #nowplaying .eq i:nth-child(3){animation-delay:-.7s}
  body.playing #nowplaying .eq i{animation-play-state:running}
  @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
  #nowplaying .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ===== gợi ý, nút ===== */
  #hint{position:absolute;z-index:20;left:0;right:0;bottom:calc(14% + env(safe-area-inset-bottom));text-align:center;font-size:.9rem;font-weight:700;color:rgba(107,34,80,.6);letter-spacing:1.5px;opacity:0;transition:opacity .8s;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.85)}
  #hint.show{opacity:1;animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  #wait{position:absolute;z-index:21;left:0;right:0;top:calc(46% + min(24vw,150px));text-align:center;color:var(--pink);text-shadow:var(--text-glow);font-size:1.1rem;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
  #wait.show{opacity:1}
  #nudge{position:absolute;z-index:21;left:0;right:0;top:calc(46% + min(24vw,150px));text-align:center;color:var(--pink);text-shadow:var(--text-glow);font-size:1.25rem;font-weight:700;letter-spacing:2px;opacity:0;transition:opacity .6s;pointer-events:none}
  #nudge.show{opacity:1;animation:pulse 1.6s ease-in-out infinite}
  #mute{position:absolute;z-index:30;top:max(22px,env(safe-area-inset-top));right:22px;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(224,69,127,.4);background:rgba(255,255,255,.72);color:var(--pink);font-size:18px;cursor:pointer;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 16px rgba(224,69,127,.18)}
  body.started #mute{display:flex}
  #progress{position:absolute;z-index:30;left:0;bottom:0;height:4px;width:0;background:linear-gradient(90deg,#ff8fbf,#ffc96b);border-radius:0 4px 4px 0}
  #replay{position:absolute;z-index:25;left:50%;top:calc(44% + min(22vw,130px) + 4rem);transform:translateX(-50%);padding:.7rem 1.6rem;border-radius:99px;border:1.5px solid rgba(224,69,127,.55);
    background:rgba(255,255,255,.8);color:#c93a72;font-family:inherit;font-weight:700;font-size:1rem;letter-spacing:1.5px;cursor:pointer;opacity:0;visibility:hidden;transition:opacity 1s;box-shadow:0 8px 24px rgba(224,69,127,.25)}
  body[data-s="14"].ended #replay{opacity:1;visibility:visible}

  /* nút bật nhạc dự phòng: chỉ hiện khi trình duyệt chặn nhạc */
  #soundbtn{position:absolute;z-index:31;left:50%;bottom:calc(6% + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;padding:.75rem 1.4rem;border-radius:99px;white-space:nowrap;
    border:1.5px solid rgba(224,69,127,.65);background:#fff;color:#c93a72;font-family:inherit;font-weight:700;font-size:1rem;letter-spacing:1px;cursor:pointer;
    box-shadow:0 8px 24px rgba(224,69,127,.3);animation:btnPulse 1.8s ease-in-out infinite}
  @keyframes btnPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.06)}}
  body.needsound #soundbtn{display:block}

  @media (max-width:560px){
    .text-layer{letter-spacing:1px}
    .text-layer.top{top:9%}
  }
  @media (prefers-reduced-motion:reduce){
    #rays,.orb1,.orb2,#blobs i{animation:none}
  }
</style>
</head>
<body data-s="0">

<div id="blobs" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="tint"><i class="t-pink"></i><i class="t-night"></i><i class="t-health"></i><i class="t-beauty"></i><i class="t-warm"></i><i class="t-green"></i><i class="t-blue"></i><i class="t-final"></i></div>
<div id="rays"></div>
<canvas id="fx"></canvas>

<!-- 5: pha lê -->
<div class="deco" id="d-crystal" aria-hidden="true">
  <svg viewBox="0 0 220 220">
    <defs>
      <radialGradient id="gGlass" cx="41%" cy="27%" r="77%"><stop offset="0" stop-color="#fff2fb" stop-opacity=".92"/><stop offset=".25" stop-color="#ffb8dc" stop-opacity=".6"/><stop offset=".73" stop-color="#b98cff" stop-opacity=".5"/><stop offset="1" stop-color="#8fa2ff" stop-opacity=".3"/></radialGradient>
      <radialGradient id="gLight" cx="40%" cy="35%" r="68%"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#fff4fa"/><stop offset=".7" stop-color="#ffc2e0"/><stop offset="1" stop-color="#ff9ccd" stop-opacity=".2"/></radialGradient>
    </defs>
    <circle cx="110" cy="110" r="79" fill="none" stroke="rgba(224,100,170,.55)" stroke-width="1.6" stroke-dasharray="1 8" stroke-linecap="round"/>

<script>
(() => {
'use strict';

/* =====================================================================
   1. KỊCH BẢN – chữ trên từng cảnh (mỗi lần chạm = sang 1 cảnh)
   ===================================================================== */
const SCENES = [
  { pos:'center', html:'này cậu gì ơi' },
  { pos:'bottom', html:'tớ là đệ tử của DangKhoa' },
  { pos:'bottom', html:'hôm nay tớ có một nhiệm vụ nhỏ là để nói với cậu rằng...' },
  { pos:'top',    cls:'pink',  html:'ờmmmmmm', sway:true },
  { pos:'top',    cls:'pink',  html:'à thì cũng sắp<br>20/10 rồi' },
  { pos:'top',    html:'nên là tớ muốn' },
  { pos:'top',    cls:'mint',  html:'chúc cậu thật nhiều sức khỏe' },
  { pos:'top',    cls:'rose',  html:'chúc cậu thật xinh đẹp' },
  { pos:'top',    cls:'gold',  html:'và chúc cậu luôn giữ<br>nụ cười trên môi' },
  { pos:'top',    cls:'green', html:'tớ tặng cậu ngọn <span class="clover-word">cỏ 4 lá</span> này' },
  { pos:'top',    cls:'green', html:'nè cầm lấy đi' },
  { pos:'top',    cls:'green', html:'chúc cậu gặp thật nhiều điều <span class="luck-word">may mắn</span>' },
  { pos:'top',    cls:'blue',  html:'mong cậu <span class="q-word">có thể?</span>' },
  { pos:'top',    cls:'blue',  html:'sẽ luôn có <br>nụ cười trên môi' },
  { pos:'top',    cls:'pink big-final', html:'Happy 20/10<span class="small-line">Happy women\'s day ♥</span>' }
];
const LAST = SCENES.length - 1;

/* =====================================================================
   3. THAM CHIẾU DOM
   ===================================================================== */
const $ = s => document.querySelector(s);
const body = document.body;
const audio = $('#audio');
const textsBox = $('#texts');
const hint = $('#hint');
const waitEl = $('#wait');
const nudge = $('#nudge');
const eyeSlides = [...document.querySelectorAll('.eye .slide')];
const fxCanvas = $('#fx');
const fx = fxCanvas.getContext('2d');

const touchLite = matchMedia('(pointer:coarse)').matches || (navigator.hardwareConcurrency || 8) <= 4;

/* sinh các lớp chữ */
SCENES.forEach((sc, i) => {
  const d = document.createElement('div');
  d.className = `text-layer ${sc.pos} ${sc.cls || ''} ${sc.sway ? 'sway' : ''}`;
  d.id = 't' + i;
  d.innerHTML = sc.html;
  textsBox.appendChild(d);
});
const textEls = [...textsBox.children];
textEls[0].classList.add('show');

/* =====================================================================
   4. VƯỜN CỎ 4 LÁ (SVG)
   ===================================================================== */
(function buildGarden(){
  const g = $('#garden');
  const NS = 'http://www.w3.org/2000/svg';
  g.innerHTML = `<defs><linearGradient id="gLeaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4f5a4"/><stop offset=".55" stop-color="#4fd272"/><stop offset="1" stop-color="#14994a"/></linearGradient></defs>`;
  const HEART = 'M0 0 C-6 -4 -26 -14 -22 -30 C-19 -42 -5 -42 0 -32 C5 -42 19 -42 22 -30 C26 -14 6 -4 0 0Z';
  // [x gốc, chiều cao thân, tỉ lệ lá, độ cong, thời gian lắc, trễ]
  const plants = [
    [95, 250, .9, -50, 4.6, -1], [200, 170, .7, 38, 3.8, -2.2], [305, 300, 1.05, -44, 5.2, -.6],
    [480, 190, .75, 42, 4.1, -3], [585, 285, 1.0, -40, 4.9, -1.7], [700, 220, .85, 46, 3.6, -2.6]
  ];
  const mk = (x, h, s, bend, sd, dl, id) => {
    const top = { x: x + bend, y: 600 - h };
    const grp = document.createElementNS(NS, 'g');
    grp.setAttribute('class', 'cl');
    if (id) grp.id = id;
    grp.style.setProperty('--ox', x + 'px');
    grp.style.setProperty('--oy', '600px');
    grp.style.setProperty('--sd', sd + 's');
    grp.style.setProperty('--dl', dl + 's');
    let leaves = '';
    for (let a = 0; a < 4; a++) leaves += `<path class="leaf" d="${HEART}" transform="rotate(${a * 90})"/>`;
    grp.style.setProperty('--dx', (400 - x) + 'px');
    grp.innerHTML = `<g class="pick"><path class="stem" d="M${x} 600 Q${x} ${600 - h * .55} ${top.x} ${top.y}"/>
      <g transform="translate(${top.x} ${top.y}) scale(${s * 1.6})">${leaves}<circle class="core" r="2.8" fill="#ffe97a"/></g>
      <circle class="hit" cx="${top.x}" cy="${top.y}" r="${56 * s}"/></g>`;
    g.appendChild(grp);
  };
  plants.forEach(p => mk(...p));
})();

/* =====================================================================
   5. HIỆU ỨNG HẠT (canvas)
   ===================================================================== */
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, touchLite ? 1.5 : 2);
  W = innerWidth; H = innerHeight;
  fxCanvas.width = W * DPR; fxCanvas.height = H * DPR;
  fx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initStars();
}

let stars = [];
const STAR_COLORS = ['255,150,195', '255,200,110', '190,150,255'];
function initStars(){
  const n = Math.min(touchLite ? 90 : 170, Math.floor(W * H / 6500));
  stars = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + .6, c: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)],
    a: Math.random(), da: (Math.random() * .02 + .004) * (Math.random() < .5 ? 1 : -1)
  }));
}

const parts = [];
const MAX_PARTS = touchLite ? 70 : 140;
const R = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* mỗi cảnh: chu kỳ sinh hạt (ms) + hàm tạo hạt */
const SPAWN = {
  3:  { every: 260,  make: () => petal(['#ff9cc8','#ffb4d6','#ff7fb5']) },
  4:  { every: 2600, make: shooting },
  5:  { every: 1800, make: shooting },
  6:  { every: 380,  make: () => rise(['#3fcaa0','#7fe3c4','#25b58c'], ['✦','+','✧'], 16) },
  7:  { every: 240,  make: () => petal(['#ff9cc8','#ffb4d6','#d2a8ff','#9fc8ff'], ['❀','✿','❁']) },
  8:  { every: 340,  make: () => rise(['#ff9fc5','#ffc36b','#c9a2ff'], ['♥','♪','♫','♬'], 22) },
  9:  { every: 300,  make: firefly },
  10: { every: 260,  make: firefly },
  11: { every: 170,  make: luckFall },
  12: { every: 420,  make: () => rise(['#7cb8ff','#b9a2ff','#5a9cf0'], ['✦','✧'], 20) },
  13: { every: 420,  make: () => rise(['#7cb8ff','#b9a2ff','#5a9cf0'], ['✦','✧'], 20) },
  14: { every: 150,  make: () => Math.random() < .5 ? rise(['#ff7fb3','#ff9cc8','#ffc83d'], ['♥','✦','♡'], 24) : petal(['#ff9cc8','#ffb4d6'], ['❀','✿']) }
};
function petal(colors, glyphs = ['❀','✿','❁']){
  parts.push({ k:'g', g: pick(glyphs), c: pick(colors), x: R(0, W), y: -30, vx: R(-.3, .3), vy: R(.7, 1.6), sw: R(.5, 1.4), ph: R(0, 6.3),
    s: R(13, 28), rot: R(0, 6.3), vr: R(-.03, .03), life: 0, max: 900, a: .85 });
}
function rise(colors, glyphs, size){
  parts.push({ k:'g', g: pick(glyphs), c: pick(colors), x: R(0, W), y: H + 20, vx: R(-.25, .25), vy: R(-1.5, -.6), sw: R(.4, 1.2), ph: R(0, 6.3),
    s: R(size * .6, size * 1.3), rot: 0, vr: 0, life: 0, max: 700, a: .9, glow: true });
}
function firefly(){
  parts.push({ k:'o', c: pick(['#7fdc6a','#ffc83d','#4ccf8e','#f7a8d0']), x: R(0, W), y: R(H * .35, H), vx: R(-.25, .25), vy: R(-.5, -.1),
    sw: R(.3, .9), ph: R(0, 6.3), s: R(1.4, 3.4), life: 0, max: 520, a: 1 });
}
function luckFall(){
  parts.push({ k:'g', g: pick(['✦','✧','♣','☘','✦']), c: pick(['#4fcf6d','#8fdc7a','#2db85a','#ffc83d']), x: R(0, W), y: -30, vx: R(-.2, .2), vy: R(1.2, 2.8),
    sw: R(.3, 1), ph: R(0, 6.3), s: R(12, 26), rot: R(0, 6.3), vr: R(-.04, .04), life: 0, max: 600, a: .9, glow: true });
}
function shooting(){
  const x = R(W * .2, W), y = R(0, H * .4);
  parts.push({ k:'s', x, y, vx: R(-9, -6), vy: R(3, 5), life: 0, max: 60, a: 1 });
}

let scene = 0;
let spawnAcc = 0, lastT = performance.now();
function frame(now){
  const dt = Math.min(64, now - lastT); lastT = now;
  fx.clearRect(0, 0, W, H);

  /* sao nền: hiện dần từ cảnh 4 */
  const starAlpha = scene >= 1 ? 1 : 0;
  starFade += (starAlpha - starFade) * Math.min(1, dt / 700);
  if (starFade > .01) {
    for (const s of stars) {
      s.a += s.da;
      if (s.a > 1 || s.a < .12) s.da *= -1;
      fx.globalAlpha = Math.max(.1, Math.min(1, s.a)) * starFade;
      fx.fillStyle = 'rgb(' + s.c + ')';
      fx.beginPath(); fx.arc(s.x, s.y, s.r, 0, 6.2832); fx.fill();
    }
  }

  /* sinh hạt */
  const sp = SPAWN[scene];
  if (sp && parts.length < MAX_PARTS) {
    spawnAcc += dt;
    const every = touchLite ? sp.every * 1.5 : sp.every;
    while (spawnAcc >= every) { spawnAcc -= every; sp.make(); }
  } else spawnAcc = 0;

  /* cập nhật + vẽ hạt */
  fx.textAlign = 'center'; fx.textBaseline = 'middle';
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt / 16.7;
    const f = p.life / p.max;
    if (p.k === 's') {
      p.x += p.vx * dt / 16.7; p.y += p.vy * dt / 16.7;
      const al = 1 - p.life / p.max;
      const g = fx.createLinearGradient(p.x, p.y, p.x - p.vx * 8, p.y - p.vy * 8);
      g.addColorStop(0, `rgba(255,120,175,${al})`); g.addColorStop(1, 'rgba(255,120,175,0)');
      fx.globalAlpha = 1; fx.strokeStyle = g; fx.lineWidth = 2;
      fx.beginPath(); fx.moveTo(p.x, p.y); fx.lineTo(p.x - p.vx * 8, p.y - p.vy * 8); fx.stroke();
      if (p.life > p.max) parts.splice(i, 1);
      continue;
    }
    p.x += (p.vx + Math.sin(p.life * .03 * p.sw + p.ph) * p.sw * .6) * dt / 16.7;
    p.y += p.vy * dt / 16.7;
    p.rot += p.vr;
    const fade = f < .1 ? f / .1 : f > .8 ? Math.max(0, (1 - f) / .2) : 1;
    fx.globalAlpha = p.a * fade;
    if (p.k === 'o') {
      fx.fillStyle = p.c; fx.shadowColor = p.c; fx.shadowBlur = 10;
      fx.beginPath(); fx.arc(p.x, p.y, p.s * (.7 + .3 * Math.sin(p.life * .08 + p.ph)), 0, 6.2832); fx.fill();
      fx.shadowBlur = 0;
    } else {
      fx.save(); fx.translate(p.x, p.y); fx.rotate(p.rot);
      fx.font = `${p.s}px sans-serif`; fx.fillStyle = p.c;
      if (p.glow) { fx.shadowColor = p.c; fx.shadowBlur = 8; }
      fx.fillText(p.g, 0, 0); fx.restore();
    }
    if (p.life > p.max || p.y > H + 60 || p.y < -60) parts.splice(i, 1);
  }
  fx.globalAlpha = 1;

  eyesTick(now, dt);
  requestAnimationFrame(frame);
}
let starFade = 0;

/* =====================================================================
   6. ĐÔI MẮT TINY – nhìn theo con trỏ, chớp mắt
   ===================================================================== */
let tx = 0, ty = 0, cx = 0, cy = 0, lastPointer = 0;
function eyeRange(){ return Math.min(innerWidth * .06, 26); }
addEventListener('pointermove', e => {
  lastPointer = performance.now();
  tx = (e.clientX / innerWidth - .5) * 2 * eyeRange();
  ty = (e.clientY / innerHeight - .5) * 2 * eyeRange() * .7;
}, { passive: true });

function eyesTick(now, dt){
  if (!body.classList.contains('eyes')) return;
  // không có con trỏ: mắt tự nhìn quanh (rõ nhất ở cảnh 2)
  if (now - lastPointer > 2500) {
    const k = scene === 2 ? 1 : .35;
    tx = Math.sin(now / 900) * eyeRange() * k;
    ty = Math.cos(now / 1300) * eyeRange() * .4 * k;
  }
  const a = Math.min(1, dt / 120);
  cx += (tx - cx) * a; cy += (ty - cy) * a;
  eyeSlides.forEach(el => { el.style.setProperty('--ex', cx.toFixed(1) + 'px'); el.style.setProperty('--ey', cy.toFixed(1) + 'px'); });
}

let blinkTimer = 0;
function scheduleBlink(){
  clearTimeout(blinkTimer);
  blinkTimer = setTimeout(() => {
    if (body.classList.contains('awake')) {
      body.classList.add('blink');
      setTimeout(() => body.classList.remove('blink'), 150);
      if (Math.random() < .25) setTimeout(() => { body.classList.add('blink'); setTimeout(() => body.classList.remove('blink'), 140); }, 280);
    }
    scheduleBlink();
  }, R(1800, 4200));
}
let winkTimer = 0;
function startWink(){
  stopWink();
  const loop = () => {
    body.classList.add('wink');
    winkTimer = setTimeout(() => { body.classList.remove('wink'); winkTimer = setTimeout(loop, 1900); }, 800);
  };
  winkTimer = setTimeout(loop, 900);
}
function stopWink(){ clearTimeout(winkTimer); body.classList.remove('wink'); }

/* =====================================================================
   7. NHẠC + CỔNG 9,7 GIÂY (giống bản mẫu: nghe một đoạn rồi chờ cậu chạm)
   ===================================================================== */
const HOLD = 9.7, FADE_FROM = 8.35, VOL = .85;
/* Đã bỏ cổng chờ: nhạc phát liền mạch từ lúc chạm đầu tiên tới hết bài. */
let musicStarted = false, gateClosed = false, gateOpen = true, gateSkipped = false;
audio.volume = VOL;

function fadeVolume(to, ms){
  const from = audio.volume, t0 = performance.now();
  (function step(now){
    const k = Math.max(0, Math.min(1, (now - t0) / ms));
    audio.volume = Math.max(0, Math.min(1, from + (to - from) * k));
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

function tryPlay(){
  if (!gateOpen && gateClosed) return;
  if (!audio.paused) return;
  const p = audio.play();
  if (p && p.catch) p.catch(() => {});
}
function startMusic(){
  if (musicStarted) return;
  musicStarted = true;
  body.classList.add('started');
  audio.volume = 0;
  tryPlay();
  fadeVolume(VOL, 2200);
  checkSound(1300);
  // nếu nhạc không chạy được (bị chặn / lỗi tải) thì không chặn câu chuyện
  setTimeout(() => { if (audio.paused || audio.error) gateSkipped = true; }, 3500);
}
let audioRetried = false;
audio.addEventListener('error', () => {
  // mạng chập chờn: thử tải lại nhạc một lần trước khi báo lỗi
  if (!audioRetried) {
    audioRetried = true;
    setTimeout(() => { try { audio.load(); if (musicStarted) tryPlay(); } catch (_) {} }, 1200);
    return;
  }
  gateSkipped = true;
  const t = $('#nowplaying .t');
  if (t) t.textContent = 'nhạc chưa tải được, tải lại trang giúp tớ nha';
  body.classList.add('started');
});

function gateTick(){
  if (gateOpen || gateSkipped) return;
  const t = audio.currentTime || 0;
  if (!gateClosed && t >= FADE_FROM && t < HOLD) audio.volume = Math.max(0, Math.min(1, VOL * (HOLD - t) / (HOLD - FADE_FROM)));
  if (!gateClosed && t >= HOLD - .02) {
    gateClosed = true;
    audio.pause();
    try { audio.currentTime = HOLD; } catch (_) {}
    audio.volume = 0;
    if (scene <= 2) scheduleNudge(2000);
  }
}
function openGate(){
  if (gateOpen) return;
  gateOpen = true; gateClosed = false;
  hideNudge();
  audio.volume = 0;
  const p = audio.play();
  if (p && p.catch) p.catch(() => {});
  const t0 = performance.now();
  (function up(now){
    const v = Math.max(0, Math.min(1, (now - t0) / 850));
    audio.volume = VOL * v;
    if (v < 1) requestAnimationFrame(up);
  })(t0);
}
function gateReady(){ return gateOpen || gateSkipped || (gateClosed && audio.currentTime >= HOLD - .045); }

let nudgeTimer = 0;
function scheduleNudge(ms){
  clearTimeout(nudgeTimer);
  nudgeTimer = setTimeout(() => {
    if (scene > 2 || document.hidden) return;
    body.classList.add('eyes', 'awake');
    nudge.classList.add('show');
  }, ms);
}
function hideNudge(){ clearTimeout(nudgeTimer); nudge.classList.remove('show'); }

let waitTimer = 0;
const WAIT_MSG = ['đợi chút xíu đii', 'đợi chút nữa thui', 'xíu nữa', 'sắp được rùi', '1 chút thuii'];
function showWait(){
  waitEl.textContent = pick(WAIT_MSG);
  waitEl.classList.add('show');
  clearTimeout(waitTimer);
  waitTimer = setTimeout(() => waitEl.classList.remove('show'), 1700);
}

/* =====================================================================
   9. CHUYỂN CẢNH
   ===================================================================== */
let canClick = true;
function setScene(i){
  const prev = scene;
  scene = i;
  body.dataset.s = i;
  textEls.forEach((el, k) => el.classList.toggle('show', k === i));

  // mắt
  if (i >= 1) body.classList.add('eyes');
  body.classList.toggle('blushing', i === 3 || i === 7 || i === 8 || i === 14);
  if (i === 12) startWink(); else stopWink();

  hint.classList.remove('show');
  clearTimeout(hintTimer);
  hint.textContent = i === 9 ? 'chạm vào 1 cọng cỏ cậu thích nha' : 'chạm để tiếp tục';
  if (i < LAST) hintTimer = setTimeout(() => hint.classList.add('show'), i === 9 ? 1500 : 4200);
  parts.length = 0; spawnAcc = 0;
  // chuyển cảnh nhanh: dọn hạt cũ nhưng giữ cảm giác liên tục
  if (i === 14) { burst(); setTimeout(() => { if (scene === LAST) body.classList.add('ended'); }, 3500); }
}
let hintTimer = 0;
function burst(){
  for (let k = 0; k < 34; k++) {
    const a = R(0, 6.2832), v = R(1.5, 5);
    parts.push({ k:'g', g: pick(['♥','✦','♡','❀']), c: pick(['#ff7fb3','#ff9cc8','#ffc83d','#ff6fa0']), x: W / 2, y: H * .44, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1,
      sw: 0, ph: 0, s: R(14, 30), rot: R(0, 6), vr: R(-.05, .05), life: 0, max: 130, a: 1, glow: true });
  }
}

function dive(){
  canClick = false;
  hint.classList.remove('show'); clearTimeout(hintTimer);
  const core = document.querySelector('.cl.picked .core') || document.querySelector('.cl .core');
  const r = core.getBoundingClientRect();
  const px = r.left + r.width / 2, py = r.top + r.height / 2;
  $('#d-clover').style.transformOrigin = px + 'px ' + py + 'px';
  const fl = $('#flash');
  fl.style.left = px + 'px'; fl.style.top = py + 'px';
  textEls[10].classList.remove('show');
  body.classList.add('dive');
  // đợi zoom xong hẳn (1.9s) rồi mới sang cảnh sau
  const d = $('#d-clover');
  let done = false;
  const next = () => {
    if (done) return; done = true;
    d.removeEventListener('transitionend', onEnd);
    setScene(11);
    setTimeout(() => { body.classList.remove('dive'); canClick = true; }, 200);
  };
  const onEnd = e => { if (e.target === d && e.propertyName === 'transform') next(); };
  d.addEventListener('transitionend', onEnd);
  setTimeout(next, 2000); // phòng khi transitionend không bắn
}
function pickClover(el){
  document.querySelectorAll('.cl.picked').forEach(c => c.classList.remove('picked'));
  if (el) el.classList.add('picked');
}
function advance(){
  if (!canClick || scene >= LAST) return;
  startMusic();
  if (scene === 9 && !document.querySelector('.cl.picked')) pickClover(document.querySelectorAll('.cl')[2]);
  if (scene === 2 && !gateReady()) { showWait(); return; }
  if (scene === 2) openGate();
  hideNudge();
  canClick = false;

  if (scene === 0) {
    textEls[0].classList.remove('show');
    scene = 0.5;
    setTimeout(() => {
      body.classList.add('eyes');
      setTimeout(() => body.classList.add('awake'), 180);
      scheduleBlink();
      setScene(1);
      canClick = true;
      if (gateClosed) scheduleNudge(2000);
    }, 700);
    return;
  }
  if (scene === 10) { dive(); return; }
  setScene(scene + 1);
  setTimeout(() => { canClick = true; }, scene === 10 ? 1800 : scene >= 13 ? 900 : 650);
  if (scene === LAST) setTimeout(() => { canClick = false; }, 0);
}

/* sự kiện */
let lastTap = 0;
document.addEventListener('pointerdown', e => {
  if (e.target.closest('#mute, #replay, #soundbtn')) return;
  const now = performance.now();
  if (now - lastTap < 250) return;
  lastTap = now;
  startMusic(); tryPlay();
  if (scene === 9) {
    const c = e.target.closest && e.target.closest('.cl');
    if (!c) { hint.classList.add('show'); return; }
    pickClover(c);
  }
  advance();
}, { passive: true });
/* điện thoại chỉ cho phát nhạc ở lúc nhấc tay (pointerup/touchend/click): thử lại ở đó nếu lần đầu bị chặn */
['pointerup', 'touchend', 'click'].forEach(ev => document.addEventListener(ev, () => {
  if (!musicStarted) return;
  if (audio.paused && !muted && !document.hidden) tryPlay();
  checkSound(900);
}, { passive: true }));
document.addEventListener('keydown', e => {
  if (['Space', 'Enter', 'ArrowRight', 'ArrowDown'].includes(e.code)) { e.preventDefault(); startMusic(); advance(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hideNudge(); if (musicStarted && !audio.paused) audio.pause(); }
  else if (musicStarted && !muted && (gateOpen || !gateClosed)) tryPlay();
});

/* nút nhạc */
let muted = false;
$('#mute').addEventListener('click', e => {
  e.stopPropagation();
  muted = !muted;
  audio.muted = muted;
  $('#mute').textContent = muted ? '✕' : '♪';
});

/* nếu trình duyệt/app vẫn chặn nhạc thì hiện nút để bấm bật */
const soundBtn = $('#soundbtn');
let soundTimer = 0;
function checkSound(delay){
  clearTimeout(soundTimer);
  soundTimer = setTimeout(() => {
    const blocked = musicStarted && audio.paused && !muted && !document.hidden && !audio.error;
    body.classList.toggle('needsound', blocked);
  }, delay);
}
audio.addEventListener('playing', () => body.classList.remove('needsound'));
soundBtn.addEventListener('click', e => {
  e.stopPropagation();
  muted = false; audio.muted = false; $('#mute').textContent = '♪';
  audio.volume = VOL;
  const p = audio.play();
  if (p && p.then) p.then(() => body.classList.remove('needsound')).catch(() => {});
});

/* hết bài */
audio.addEventListener('ended', () => { body.classList.add('ended'); });
audio.addEventListener('play', () => body.classList.add('playing'));
audio.addEventListener('pause', () => body.classList.remove('playing'));
$('#replay').addEventListener('click', e => {
  e.stopPropagation();
  body.classList.remove('ended', 'eyes', 'awake', 'blushing', 'started', 'needsound');
  musicStarted = false; gateClosed = false; gateOpen = true; gateSkipped = false;
  audio.pause(); audio.currentTime = 0; audio.volume = VOL;
  clearTimeout(blinkTimer); stopWink();
  pickClover(null);
  setScene(0);
  textEls[0].classList.add('show');
  canClick = true;
});

/* đồng hồ nhạc */
audio.addEventListener('timeupdate', () => {
  gateTick();
  if (audio.duration) $('#progress').style.width = (audio.currentTime / audio.duration * 100) + '%';
  // bài kết thúc mà cậu chưa tới cảnh cuối thì vẫn để cậu tự bấm tiếp
  if (scene === LAST && audio.duration && audio.currentTime > audio.duration - 4) body.classList.add('ended');
});

addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
